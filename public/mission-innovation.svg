<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Fond degradé chaud evoquant le Sahel au coucher du soleil -->
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="60%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="solarGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E3A5F"/>
    </linearGradient>
    <linearGradient id="accentRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B70011"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
    <filter id="glowRed">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ciel -->
  <rect width="800" height="600" fill="url(#skyGrad)"/>

  <!-- Soleil -->
  <circle cx="650" cy="100" r="55" fill="#FDE68A" opacity="0.7"/>
  <circle cx="650" cy="100" r="40" fill="#FCD34D" opacity="0.9"/>
  <circle cx="650" cy="100" r="28" fill="#F59E0B"/>

  <!-- Rayons soleil -->
  <g stroke="#FCD34D" stroke-width="2" opacity="0.5">
    <line x1="650" y1="30" x2="650" y2="18"/>
    <line x1="650" y1="170" x2="650" y2="182"/>
    <line x1="580" y1="100" x2="568" y2="100"/>
    <line x1="720" y1="100" x2="732" y2="100"/>
    <line x1="600" y1="50" x2="591" y2="41"/>
    <line x1="700" y1="150" x2="709" y2="159"/>
    <line x1="700" y1="50" x2="709" y2="41"/>
    <line x1="600" y1="150" x2="591" y2="159"/>
  </g>

  <!-- Collines sahéliennes à l'horizon -->
  <ellipse cx="120" cy="380" rx="200" ry="80" fill="#D97706" opacity="0.3"/>
  <ellipse cx="680" cy="390" rx="180" ry="70" fill="#B45309" opacity="0.25"/>
  <ellipse cx="400" cy="400" rx="250" ry="60" fill="#92400E" opacity="0.2"/>

  <!-- Sol / terre -->
  <rect x="0" y="430" width="800" height="170" fill="url(#groundGrad)" rx="0"/>
  <rect x="0" y="430" width="800" height="20" fill="#A16207" opacity="0.4"/>

  <!-- ═══ PANNEAU SOLAIRE (gauche) ═══ -->
  <g filter="url(#softShadow)">
    <!-- Support -->
    <rect x="80" y="320" width="8" height="120" fill="#6B7280" rx="2"/>
    <rect x="60" y="435" width="48" height="8" fill="#6B7280" rx="2"/>
    <!-- Cadre panneau -->
    <rect x="20" y="220" width="130" height="110" rx="6" fill="#374151"/>
    <!-- Cellules solaires -->
    <rect x="26" y="226" width="38" height="30" rx="2" fill="url(#solarGrad)"/>
    <rect x="70" y="226" width="38" height="30" rx="2" fill="url(#solarGrad)"/>
    <rect x="114" y="226" width="30" height="30" rx="2" fill="url(#solarGrad)"/>
    <rect x="26" y="262" width="38" height="30" rx="2" fill="url(#solarGrad)"/>
    <rect x="70" y="262" width="38" height="30" rx="2" fill="url(#solarGrad)"/>
    <rect x="114" y="262" width="30" height="30" rx="2" fill="url(#solarGrad)"/>
    <rect x="26" y="298" width="38" height="26" rx="2" fill="url(#solarGrad)"/>
    <rect x="70" y="298" width="38" height="26" rx="2" fill="url(#solarGrad)"/>
    <rect x="114" y="298" width="30" height="26" rx="2" fill="url(#solarGrad)"/>
    <!-- Reflet -->
    <rect x="26" y="226" width="118" height="6" fill="white" opacity="0.1" rx="2"/>
  </g>

  <!-- ═══ TABLETTE / ECRAN TECHNOLOGIQUE (centre) ═══ -->
  <g filter="url(#softShadow)">
    <rect x="290" y="200" width="220" height="260" rx="16" fill="url(#screenGrad)"/>
    <rect x="300" y="210" width="200" height="220" rx="10" fill="#0F172A"/>
    <!-- Contenu ecran : graphe de donnees -->
    <rect x="310" y="220" width="180" height="4" rx="2" fill="#334155"/>
    <!-- Barres graphe -->
    <rect x="320" y="300" width="22" height="60" rx="3" fill="url(#accentGreen)" opacity="0.8"/>
    <rect x="350" y="275" width="22" height="85" rx="3" fill="url(#accentGreen)" opacity="0.9"/>
    <rect x="380" y="310" width="22" height="50" rx="3" fill="url(#accentGreen)"/>
    <rect x="410" y="260" width="22" height="100" rx="3" fill="url(#accentRed)" opacity="0.9"/>
    <rect x="440" y="285" width="22" height="75" rx="3" fill="url(#accentGreen)" opacity="0.85"/>
    <rect x="470" y="295" width="22" height="65" rx="3" fill="url(#accentGreen)" opacity="0.8"/>
    <!-- Labels ecran -->
    <rect x="310" y="235" width="70" height="6" rx="3" fill="#475569"/>
    <rect x="310" y="248" width="50" height="5" rx="2" fill="#22C55E" opacity="0.7"/>
    <!-- Axe -->
    <line x1="315" y1="362" x2="497" y2="362" stroke="#334155" stroke-width="1.5"/>
    <line x1="315" y1="362" x2="315" y2="250" stroke="#334155" stroke-width="1.5"/>
    <!-- Courbe tendance -->
    <polyline points="320,340 350,315 380,328 410,290 440,308 470,300" stroke="#F59E0B" stroke-width="2" fill="none" stroke-dasharray="4,3"/>
    <!-- Badge en haut de l ecran -->
    <rect x="310" y="220" width="180" height="28" rx="8" fill="url(#accentRed)" opacity="0.15"/>
    <circle cx="325" cy="234" r="5" fill="#22C55E"/>
    <rect x="336" y="230" width="60" height="5" rx="2" fill="#94A3B8"/>
    <!-- Bouton home tablette -->
    <circle cx="400" cy="448" r="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <circle cx="400" cy="448" r="6" fill="#0F172A"/>
  </g>

  <!-- ═══ ANTENNE / CONNECTIVITE (droite haute) ═══ -->
  <g opacity="0.85">
    <rect x="670" y="250" width="6" height="100" fill="#6B7280" rx="2"/>
    <rect x="645" y="345" width="56" height="6" fill="#6B7280" rx="2"/>
    <!-- Ondes wifi -->
    <path d="M673 230 Q673 200 673 200" stroke="#B70011" stroke-width="2.5" fill="none" opacity="0.9"/>
    <path d="M650 245 Q673 210 696 245" stroke="#B70011" stroke-width="2.5" fill="none" opacity="0.75" stroke-linecap="round"/>
    <path d="M635 260 Q673 215 711 260" stroke="#B70011" stroke-width="2" fill="none" opacity="0.55" stroke-linecap="round"/>
    <path d="M620 278 Q673 220 726 278" stroke="#B70011" stroke-width="1.5" fill="none" opacity="0.35" stroke-linecap="round"/>
    <!-- Noeud central -->
    <circle cx="673" cy="248" r="6" fill="#B70011"/>
    <circle cx="673" cy="248" r="3" fill="white"/>
  </g>

  <!-- ═══ LIGNES DE CONNEXION (reseau) ═══ -->
  <g stroke="#B70011" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.35">
    <line x1="150" y1="285" x2="290" y2="310"/>
    <line x1="510" y1="320" x2="660" y2="300"/>
    <line x1="400" y1="200" x2="670" y2="250"/>
  </g>

  <!-- ═══ PERSONNAGES (communaute) ═══ -->
  <!-- Personne 1 (gauche, chemise verte) -->
  <g>
    <circle cx="195" cy="370" r="22" fill="#92400E"/>
    <circle cx="195" cy="360" r="14" fill="#D97706"/>
    <!-- vetement -->
    <path d="M170 430 Q170 395 195 390 Q220 395 220 430 Z" fill="#15803D"/>
    <!-- bras gauche pointant vers tablette -->
    <line x1="170" y1="405" x2="285" y2="380" stroke="#15803D" stroke-width="10" stroke-linecap="round"/>
    <circle cx="168" cy="405" r="8" fill="#D97706"/>
  </g>

  <!-- Personne 2 (droite de l ecran, robe rouge) -->
  <g>
    <circle cx="610" cy="365" r="22" fill="#92400E"/>
    <circle cx="610" cy="355" r="14" fill="#B45309"/>
    <!-- vetement -->
    <path d="M585 430 Q585 390 610 385 Q635 390 635 430 Z" fill="#B70011"/>
    <!-- bras gauche vers tablette -->
    <line x1="585" y1="395" x2="515" y2="378" stroke="#B70011" stroke-width="10" stroke-linecap="round"/>
    <circle cx="587" cy="395" r="8" fill="#B45309"/>
  </g>

  <!-- Personne 3 (milieu devant ecran, plus proche) -->
  <g>
    <circle cx="400" cy="480" r="25" fill="#92400E"/>
    <circle cx="400" cy="468" r="16" fill="#C2884A"/>
    <path d="M370 540 Q370 498 400 492 Q430 498 430 540 Z" fill="#1D4ED8"/>
    <!-- bras leve vers haut -->
    <line x1="370" y1="510" x2="345" y2="480" stroke="#1D4ED8" stroke-width="10" stroke-linecap="round"/>
    <circle cx="343" cy="480" r="8" fill="#C2884A"/>
    <line x1="430" y1="510" x2="460" y2="475" stroke="#1D4ED8" stroke-width="10" stroke-linecap="round"/>
    <circle cx="462" cy="474" r="8" fill="#C2884A"/>
  </g>

  <!-- ═══ AMPOULE INNOVATION (flottante en haut) ═══ -->
  <g filter="url(#softShadow)" opacity="0.9">
    <circle cx="400" cy="95" r="38" fill="#FEF3C7" opacity="0.9"/>
    <circle cx="400" cy="95" r="28" fill="#FDE68A"/>
    <!-- Ampoule shape -->
    <ellipse cx="400" cy="90" rx="14" ry="16" fill="#F59E0B"/>
    <rect x="394" y="104" width="12" height="6" rx="2" fill="#D97706"/>
    <rect x="396" y="109" width="8" height="4" rx="1" fill="#92400E"/>
    <!-- Rayons ampoule -->
    <line x1="400" y1="56" x2="400" y2="48" stroke="#F59E0B" stroke-width="2"/>
    <line x1="423" y1="63" x2="429" y2="57" stroke="#F59E0B" stroke-width="2"/>
    <line x1="377" y1="63" x2="371" y2="57" stroke="#F59E0B" stroke-width="2"/>
    <line x1="433" y1="90" x2="441" y2="90" stroke="#F59E0B" stroke-width="2"/>
    <line x1="367" y1="90" x2="359" y2="90" stroke="#F59E0B" stroke-width="2"/>
  </g>

  <!-- ═══ BADGE BURKINA FASO (coin haut gauche) ═══ -->
  <g>
    <rect x="20" y="20" width="160" height="36" rx="18" fill="#0F172A" opacity="0.75"/>
    <!-- Etoile rouge (drapeau BF) -->
    <polygon points="42,38 44,32 46,38 40,34 48,34" fill="#EF4444"/>
    <!-- Texte Burkina Faso -->
    <rect x="56" y="30" width="80" height="6" rx="3" fill="#E5E7EB" opacity="0.9"/>
    <rect x="56" y="41" width="55" height="5" rx="2" fill="#9CA3AF" opacity="0.7"/>
  </g>

  <!-- ═══ BADGE "INNOVER ENSEMBLE" (coin bas droit) ═══ -->
  <g filter="url(#softShadow)">
    <rect x="600" y="440" width="180" height="60" rx="12" fill="white" opacity="0.92"/>
    <rect x="610" y="452" width="80" height="6" rx="3" fill="#B70011" opacity="0.9"/>
    <rect x="610" y="464" width="60" height="5" rx="2" fill="#374151" opacity="0.6"/>
    <rect x="610" y="475" width="100" height="4" rx="2" fill="#374151" opacity="0.4"/>
    <!-- Icone -->
    <circle cx="758" cy="470" r="16" fill="#FEF3C7"/>
    <circle cx="758" cy="470" r="10" fill="#F59E0B"/>
    <circle cx="754" cy="468" r="3" fill="white"/>
    <circle cx="762" cy="472" r="3" fill="white"/>
    <line x1="754" y1="471" x2="762" y2="469" stroke="white" stroke-width="1.5"/>
  </g>

  <!-- ═══ PARTICULES / ETINCELLES ═══ -->
  <circle cx="240" cy="150" r="3" fill="#F59E0B" opacity="0.7"/>
  <circle cx="560" cy="175" r="4" fill="#22C55E" opacity="0.6"/>
  <circle cx="150" cy="200" r="2.5" fill="#B70011" opacity="0.5"/>
  <circle cx="700" cy="180" r="3" fill="#F59E0B" opacity="0.6"/>
  <circle cx="350" cy="155" r="2" fill="#3B82F6" opacity="0.7"/>
  <circle cx="480" cy="130" r="3.5" fill="#22C55E" opacity="0.5"/>

  <!-- ═══ VEGETATION (acacia stylise) ═══ -->
  <g opacity="0.7">
    <!-- Tronc -->
    <rect x="734" y="370" width="8" height="65" fill="#78350F" rx="2"/>
    <!-- Feuillage horizontal acacia -->
    <ellipse cx="738" cy="362" rx="45" ry="14" fill="#15803D" opacity="0.8"/>
    <ellipse cx="710" cy="375" rx="28" ry="10" fill="#16A34A" opacity="0.7"/>
    <ellipse cx="768" cy="378" rx="28" ry="10" fill="#15803D" opacity="0.7"/>
  </g>

  <!-- Petit acacia derriere personnage gauche -->
  <g opacity="0.5">
    <rect x="240" y="390" width="5" height="45" fill="#78350F" rx="1"/>
    <ellipse cx="242" cy="384" rx="28" ry="10" fill="#15803D"/>
    <ellipse cx="220" cy="392" rx="18" ry="8" fill="#16A34A"/>
    <ellipse cx="264" cy="393" rx="18" ry="8" fill="#15803D"/>
  </g>
</svg>
